<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Keith Checkers - Widget Test Runner</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            font-family: 'Outfit', sans-serif;
            background: #0a0304;
            color: #f7ede9;
            padding: 30px;
            display: block;
        }
        .test-container {
            max-width: 800px;
            margin: 0 auto;
            background: linear-gradient(160deg, #1c0709 0%, #0d0304 100%);
            border: 1px solid #3d0c11;
            border-radius: 14px;
            padding: 24px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
        }
        h1 {
            color: #ff4d4d;
            margin-bottom: 8px;
        }
        .subtitle {
            color: #a88b90;
            margin-bottom: 20px;
        }
        .test-summary {
            display: flex;
            gap: 16px;
            margin-bottom: 20px;
        }
        .badge {
            padding: 8px 16px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 1rem;
        }
        .badge-passed { background: rgba(46, 204, 113, 0.2); color: #2ecc71; border: 1px solid #2ecc71; }
        .badge-failed { background: rgba(230, 43, 58, 0.2); color: #ff4d4d; border: 1px solid #ff4d4d; }
        
        .test-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .test-item {
            background: #140406;
            border: 1px solid #3d0c11;
            padding: 12px 16px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .test-name { font-weight: 600; }
        .test-status { font-weight: 700; font-size: 0.9rem; }
        .status-pass { color: #2ecc71; }
        .status-fail { color: #ff4d4d; }

        /* Hidden fixture container for DOM widget testing */
        #fixture-container {
            display: none;
        }
    </style>
</head>
<body>
    <div class="test-container">
        <h1>🧪 Counter Widget Test Suite</h1>
        <p class="subtitle">Automated source code tests for +, -, and 0 counter buttons in Keith Checkers.</p>
        
        <div class="test-summary">
            <div id="badge-pass" class="badge badge-passed">Passed: 0</div>
            <div id="badge-fail" class="badge badge-failed">Failed: 0</div>
        </div>

        <ul id="test-results" class="test-list"></ul>
    </div>

    <!-- Hidden DOM fixture representing the widget under test -->
    <div id="fixture-container">
        <div class="counter-card">
            <span id="counter-value" class="counter-display">0</span>
            <div class="counter-controls">
                <button id="btn-counter-minus" class="btn btn-counter btn-counter-minus">-</button>
                <button id="btn-counter-zero" class="btn btn-counter btn-counter-zero">0</button>
                <button id="btn-counter-plus" class="btn btn-counter btn-counter-plus">+</button>
            </div>
        </div>
        <!-- Dummy elements required by CheckersGame constructor -->
        <div id="board"></div>
        <div id="status-text"></div>
        <div id="turn-dot"></div>
        <div id="timer-display"></div>
        <div id="red-count"></div>
        <div id="black-count"></div>
        <div id="red-captured"></div>
        <div id="black-captured"></div>
        <div id="history-list"></div>
        <select id="mode-select"><option value="ai">AI</option></select>
        <select id="difficulty-select"><option value="medium">Medium</option></select>
        <select id="player-color-select"><option value="red">Red</option></select>
        <input type="checkbox" id="forced-jumps-toggle">
        <div id="ai-difficulty-group"></div>
        <button id="btn-new-game"></button>
        <button id="btn-undo"></button>
        <button id="btn-hint"></button>
        <div id="victory-modal" class="hidden"></div>
        <div id="modal-title"></div>
        <div id="modal-message"></div>
        <button id="modal-restart"></button>
    </div>

    <script src="game.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const resultsList = document.getElementById('test-results');
            const badgePass = document.getElementById('badge-pass');
            const badgeFail = document.getElementById('badge-fail');

            let passCount = 0;
            let failCount = 0;

            function assert(condition, testName, message) {
                const li = document.createElement('li');
                li.className = 'test-item';
                
                if (condition) {
                    passCount++;
                    li.innerHTML = `<span class="test-name">✓ ${testName}</span><span class="test-status status-pass">PASS</span>`;
                } else {
                    failCount++;
                    li.innerHTML = `<span class="test-name">✗ ${testName} (${message || 'Assertion failed'})</span><span class="test-status status-fail">FAIL</span>`;
                }
                resultsList.appendChild(li);
            }

            // Execute Test Cases
            try {
                const gameInstance = window.game;

                // Test 1: Button Existence
                const minusBtn = document.getElementById('btn-counter-minus');
                const zeroBtn = document.getElementById('btn-counter-zero');
                const plusBtn = document.getElementById('btn-counter-plus');
                const display = document.getElementById('counter-value');

                assert(minusBtn !== null, "Widget Test: Minus (-) button exists in DOM");
                assert(zeroBtn !== null, "Widget Test: Zero (0) button exists in DOM");
                assert(plusBtn !== null, "Widget Test: Plus (+) button exists in DOM");
                assert(display !== null, "Widget Test: Counter display element exists");

                // Test 2: Initial State
                zeroBtn.click();
                assert(display.textContent === '0', "Widget Test: Initial counter value is 0");

                // Test 3: Plus (+) Button Increments
                plusBtn.click();
                assert(display.textContent === '1', "Widget Test: Clicking (+) increments counter to 1");

                plusBtn.click();
                plusBtn.click();
                assert(display.textContent === '3', "Widget Test: Clicking (+) two more times increments to 3");

                // Test 4: Minus (-) Button Decrements
                minusBtn.click();
                assert(display.textContent === '2', "Widget Test: Clicking (-) decrements counter to 2");

                minusBtn.click();
                minusBtn.click();
                minusBtn.click();
                assert(display.textContent === '-1', "Widget Test: Clicking (-) below 0 decrements to negative numbers (-1)");

                // Test 5: Zero (0) Button Resets
                zeroBtn.click();
                assert(display.textContent === '0', "Widget Test: Clicking (0) resets counter back to 0");

            } catch (err) {
                assert(false, "Widget Test Suite Execution", err.message);
            }

            badgePass.textContent = `Passed: ${passCount}`;
            badgeFail.textContent = `Failed: ${failCount}`;
        });
    </script>
</body>
</html>
